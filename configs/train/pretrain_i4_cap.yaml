# TAKSH cap-corpus — warmstart experiment (30M-parameter base).
#
# Authorized: owner approved "bounded CPU experiments" + "I am not open to any
# money; I am open for open source" (2026-11-19); computed from the local
# open-code corpus only (this repo Apache-2.0 + installed open pip packages).
# No money, no external data, no GPU authorized.
#
# Warmstarts from the pretrained 15M base (runs/v160_pretrain) on the local
# open-code capability corpus. Bounded, CPU-ONLY. No capability claim.

run:
  name: qm-code-cap-warmstart
  model_config: configs/model/code_v160_15m.yaml
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  seed: 123

data:
  tokens_path: data/cap_corpus.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 4

training:
  max_steps: 600
  checkpoint_every_steps: 100
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/cap_warmstart/run_manifest.json
