# Taksh L0.2 high-LR probe - one bounded experiment on the qualified L0.2 data.
#
# Evidence trail: v1.8.0 SFT (57 pairs, lr 5e-5, 200 steps) -> degenerate.
# L0.2 SFT (260 pairs, lr 5e-5, 300 steps) -> underfit (ema ~4.0), 0/30.
# L0.2 overfit gate (24 pairs, lr 1e-3, 800 steps) -> 24/24 memorized.
# This run: 260 pairs, lr 1e-3, 500 steps (~7.7 epochs). New directory; nothing
# overwritten. Purpose: does the recipe that memorizes also yield ANY held-out
# functional accuracy? Reported honestly whatever the result.

run:
  name: qm-code-l02-sft-hp
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  seq_len: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 5
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 1

training:
  max_steps: 500
  checkpoint_every_steps: 500
  log_every_steps: 20

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: false
