# M3 base-model pretraining: QuantsMind-LLM from random init.
#
# THIS IS THE CONFIG USED FOR THE M3 DEMONSTRATION RUN.
# `configs/train/pretrain_m3_small.yaml` is the documented fallback if this one
# cannot start (see the memory note in configs/model/code_m3_9m.yaml).
#
# Measured on this host by `python -m training.preflight --config
# configs/train/pretrain_m3.yaml --probe-steps 3`:
#   9,359,104 params, peak RSS ~207 MiB, ~705 tokens/s,
#   400 steps (1,638,400 tokens) ~= 39 minutes.
#
# DATA PROVENANCE
# ---------------
# Trained on `data/m3_code_verified.*`, built by
# `python -m data.prepare_m3_dataset`. That builder withholds every record
# whose source licence is unresolved:
#
#   withheld: psf-black, pypa-setuptools (162 records, 37% of the M2 corpus)
#   train   : 193 records / 5 repos  -> 1,165,217 tokens
#   val     :  63 records / 1 repo   ->   340,077 tokens
#   holdout : test split NOT emitted (unresolved licence; kept unspent)
#
# Train and val share no repository and no content hash. Val tokens are loaded
# from a SEPARATE artifact, so validation data cannot reach an optimizer step.
#
# Rebuild the data:
#   python -m data.prepare_m3_dataset --out-prefix data/m3_code_verified
run:
  name: qm-code-m3-base
  # vocab_size 5822 == tokenizer/qm_code_bpe_v0.json exactly.
  model_config: configs/model/code_m3_9m.yaml
  seed: 42

data:
  # Licence-gated, verified-sources-only train split.
  tokens_path: data/m3_code_verified.train.tokens.bin
  # Separate artifact. Evaluated under torch.no_grad(); never optimised.
  val_tokens_path: data/m3_code_verified.val.tokens.bin
  tokenizer: tokenizer/qm_code_bpe_v0.json
  dataset_manifest: data/m3_code_verified.manifest.json
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32            # CPU-only host; fp32/bf16 autocast is not a win here
  device: auto              # auto | cpu | cuda | mps

batch:
  micro_batch_size: 1
  grad_accum_steps: 8       # 1 x 512 x 8 = 4096 tokens/step

training:
  # 400 steps x 4096 tokens = 1,638,400 tokens ~= 1.4 epochs over the 1.17M
  # token train split. Sized to demonstrate a real run in under an hour on
  # CPU, not to reach convergence -- this milestone measures the pipeline, not
  # model quality. Loss is expected to fall below the uniform-random baseline
  # of ln(5822) = 8.67; useful code generation is NOT an expected outcome.
  #
  # Pre-registered completion criteria for this run (fixed before it started,
  # so the result cannot be rationalised after the fact):
  #   - all 400 steps complete with finite loss
  #   - final train loss < 3.0 (clearly better than uniform random at 8.67)
  #   - validation loss is finite and does not exceed train loss + 2.0
  #   - checkpoint saves, verifies, reloads in a fresh process, and generates
  max_steps: 400
  checkpoint_every_steps: 100
  log_every_steps: 10
  # Read by this loop (the M2 loop declared but ignored it).
  eval_every_steps: 50
  val_batches: 8            # windows per validation pass; fixed seed, so
                             # every validation sees the SAME windows
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/m3_base/run_manifest.json