# Taksh v1.6.0 — SFT (Supervised Fine-Tuning) config
#
# Fine-tunes the v1.6.0 pretrained checkpoint on instruction→code completion
# pairs from evaluation/simple_humaneval.py.
#
# Demonstration scale: 20 examples, 100 steps, CPU-only.
# Goal: pass@1 > 0 on simple_humaneval after SFT.

run:
  name: qm-code-v160-sft
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/v160_sft/sft.jsonl
  val_jsonl: data/v160_sft/sft.jsonl
  max_length: 512
  dataset_manifest: data/v160_tokens/manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 5
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 100
  checkpoint_every_steps: 50
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/v160_sft/run_manifest.json
