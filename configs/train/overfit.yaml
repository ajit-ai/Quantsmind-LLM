# Taksh L0.2 Phase B - overfitting gate.
#
# 24 original examples; the pipeline must memorize these before we trust any
# capability claim from larger runs. 24 files are too small for generalization;
# this only tests that gradients flow and the loop learns at all.
#
# Init: runs/v160_pretrain/checkpoint_last.pt (untouched). Output: runs/l02_overfit/
# (new directory; nothing overwritten).

run:
  name: qm-code-l02-overfit
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_overfit/sft.jsonl
  val_jsonl: data/l02_overfit/sft.jsonl
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 5
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 1

training:
  max_steps: 800
  checkpoint_every_steps: 800
  log_every_steps: 20

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: false
