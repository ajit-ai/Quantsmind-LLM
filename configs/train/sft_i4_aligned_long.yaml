# TAKSH local capability experiment — extended aligned SFT.
#
# Why this run exists: the first I4 aligned SFT (130 steps, ~1 epoch, final
# loss 4.86) was never evaluated under the template it was trained with. This
# run extends the same local, CC0 l02_sft data for a bounded number of steps so
# the instruction-following hypothesis can be tested fairly.
#
# Bounded, CPU-only, local corpus only. No external data, no money, no release,
# no capability claim. Checkpoints stay in runs/ and are never committed.

run:
  name: qm-code-i4-aligned-long
  base_checkpoint: runs/v180_sft/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  max_length: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 20
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 1000
  checkpoint_every_steps: 200
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/i4_aligned_sft_long/run_manifest.json
