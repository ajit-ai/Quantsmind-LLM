# TAKSH local capability experiment — second aligned SFT continuation.
#
# The 1,000-step run reached training loss 2.47 but still 0/20 correct: outputs
# collapsed to '' or degenerate loops. This run tests whether that is an
# optimization limit (fixable with more steps and a higher LR) or a capacity
# limit of the 28.8M model.
#
# Bounded, CPU-only, local corpus only. No external data, no money, no release,
# no capability claim. Checkpoints stay in runs/ and are never committed.

run:
  name: qm-code-i4-aligned-long2
  base_checkpoint: runs/i4_aligned_sft_long/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 43

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  max_length: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 50
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 2000
  checkpoint_every_steps: 500
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/i4_aligned_sft_long2/run_manifest.json
