run:
  name: qm-code-smoke
  model_config: configs/model/code_30m.yaml
  seed: 42

data:
  dataset_tag: code-corpus-v0
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  grad_accum_steps: 1

batch:
  micro_batch_size: 1
  global_tokens_per_step: 512

training:
  max_steps: 50
  checkpoint_every_steps: 25
  keep_checkpoints: 2
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
