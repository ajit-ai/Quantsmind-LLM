# M7 candidate pretraining: 9.36M parameters, from random init, CPU-only.
#
# Why 300 steps and not M3's 400
# ------------------------------
# The host measured 334 tokens/s during M7 preflight (M3 measured ~705). At
# 4096 tokens/step, 300 steps is 1,228,800 tokens -- 1.05 passes over the
# 1,165,217-token training stream -- and about 61 minutes. 400 steps would be
# ~82 minutes, which is still bounded, but 300 is the closest whole-pass budget
# under 90 minutes. The step count is fixed BEFORE training; it is not changed
# after seeing a loss.
#
# Data
# ----
# Built by `python -m data.prepare_m7_pretrain`. Train is the same five verified
# repositories M3 trained on (193 records, 1,165,217 tokens), proven by content
# hash overlap in the manifest. Validation is only the even file-hash bucket of
# aiohttp (26 records, 142,340 tokens). The odd bucket is NOT encoded here; it
# is reserved for development evaluation, so validation cannot select on it.
#
# This config does not train on psf-requests. That repository is the locked M7
# evaluation partition.
run:
  name: qm-code-m7-pretrain
  model_config: configs/model/code_m3_9m.yaml
  seed: 42

data:
  tokens_path: data/m7/pretrain.train.tokens.bin
  val_tokens_path: data/m7/pretrain.val.tokens.bin
  tokenizer: tokenizer/qm_code_bpe_v0.json
  dataset_manifest: data/m7/pretrain.manifest.json
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 1
  grad_accum_steps: 8

training:
  max_steps: 300
  checkpoint_every_steps: 100
  log_every_steps: 10
  eval_every_steps: 50
  val_batches: 8
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/m7_pretrain/run_manifest.json
