# Taksh v2.0.0 — SFT (Supervised Fine-Tuning): 7B Parameter Model
#
# Fine-tunes the v2.0.0 pretrained checkpoint on instruction→code pairs.
# Requires GPU cluster.
#
# Target: Competitive with CodeLlama-7B / DeepSeek-Coder-7B tier.

run:
  name: qm-code-v200-7b-sft
  base_checkpoint: runs/v200_7b_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v200_7b.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v2.json
  train_jsonl: data/v200_sft/train.jsonl
  val_jsonl: data/v200_sft/val.jsonl
  max_length: 4096
  dataset_manifest: data/v200_sft/manifest.json

optimizer:
  type: adamw
  lr_peak: 2.0e-5
  lr_schedule: cosine
  warmup_steps: 100
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: auto

batch:
  micro_batch_size: 8
  grad_accum_steps: 4

training:
  max_steps: 10000
  checkpoint_every_steps: 1000
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 50

logging:
  tracker: wandb
  write_run_manifest: true
  run_manifest_path: runs/v200_7b_sft/run_manifest.json
