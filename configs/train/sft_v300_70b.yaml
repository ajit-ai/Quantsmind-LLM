# Taksh v3.0.0 — SFT (Supervised Fine-Tuning): 70B Parameter Model
#
# Fine-tunes the v3.0.0 pretrained checkpoint on instruction→code pairs.
# GPU cluster required.

run:
  name: qm-code-v300-70b-sft
  base_checkpoint: runs/v300_70b_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v300_70b.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v3.json
  train_jsonl: data/v300_sft/train.jsonl
  val_jsonl: data/v300_sft/val.jsonl
  max_length: 131072
  dataset_manifest: data/v300_sft/manifest.json

optimizer:
  type: adamw
  lr_peak: 1.0e-5
  lr_schedule: cosine
  warmup_steps: 100
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: auto

batch:
  micro_batch_size: 1
  grad_accum_steps: 32

training:
  max_steps: 20000
  checkpoint_every_steps: 2000
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 50

logging:
  tracker: wandb
  write_run_manifest: true
  run_manifest_path: runs/v300_70b_sft/run_manifest.json
