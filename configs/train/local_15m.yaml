# Pre-training config — local prototype on founder's machine (i7-8550U + MX150)
# Duration: ~2-5 hours CPU / ~1-2 hours MX150 for 5000 steps
# Cost: ₹0 (electricity you already pay)
run:
  name: qm-local-15m-v0
  model_config: configs/model/local_15m.yaml
  seed: 42

data:
  dataset_tag: corpus-v0
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 100
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  grad_accum_steps: 4

batch:
  micro_batch_size: 8
  global_tokens_per_step: 16384   # 8 × 512 × 4 accum = 16k tokens/step

training:
  max_steps: 5000
  checkpoint_every_steps: 500
  keep_checkpoints: 3
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 50

logging:
  tracker: none
