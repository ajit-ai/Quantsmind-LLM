# Taksh L0.2 round 2 - continued SFT from the L0.2 candidate (step 300).
#
# The L0.2 candidate is underfit: train loss plateaued near 4.0 and greedy
# decoding still collapses. Evidence justifies one more bounded round of the
# same recipe on the same data (small-scale continued training), initialised
# from runs/l02_sft/checkpoint_last.pt. Never overwrites the round-1 artifact.

run:
  name: qm-code-l02-sft-r2
  base_checkpoint: runs/l02_sft/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  seq_len: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 1

training:
  max_steps: 300
  checkpoint_every_steps: 150
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: false
