# Taksh v2.0.0 — DPO (Direct Preference Optimization): 7B Parameter Model
#
# Aligns the v2.0.0 SFT model using preference pairs.
# Requires GPU cluster.
#
# Target: Improved code quality, safety, and helpfulness.

run:
  name: qm-code-v200-7b-dpo
  base_checkpoint: runs/v200_7b_sft/checkpoint_last.pt
  base_model_config: configs/model/code_v200_7b.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v2.json
  train_jsonl: data/v200_dpo/train.jsonl
  val_jsonl: data/v200_dpo/val.jsonl
  max_length: 4096
  dataset_manifest: data/v200_dpo/manifest.json
  beta: 0.1

optimizer:
  type: adamw
  lr_peak: 5.0e-7
  lr_schedule: cosine
  warmup_steps: 50
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 8

training:
  max_steps: 5000
  checkpoint_every_steps: 500
  log_every_steps: 25

watchdog:
  nan_check_every_steps: 25

logging:
  tracker: wandb
  write_run_manifest: true
  run_manifest_path: runs/v200_7b_dpo/run_manifest.json
