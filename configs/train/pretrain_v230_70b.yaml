# Taksh v2.3.0 — Pretraining: 70B Parameter Model (GPU cluster required)
#
# Trains qm-code-v230-70b on a large cleared code corpus.
# GPU cluster REQUIRED — CPU training is impractical (~years).
#
# Target capability: Qwen-72B / DeepSeek-Coder-72B tier on coding benchmarks.
# Requires 50B+ pretraining tokens + extensive SFT + DPO + multimodal.

run:
  name: qm-code-v230-70b-pretrain
  model_config: configs/model/code_v230_70b.yaml
  seed: 42

data:
  tokens_path: data/v230_tokens/train.tokens.bin
  val_tokens_path: data/v230_tokens/val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v3.json
  dataset_manifest: data/v230_tokens/manifest.json
  seq_len: 131072

optimizer:
  type: adamw
  lr_peak: 1.5e-4
  lr_schedule: cosine
  warmup_steps: 2000
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: auto

batch:
  micro_batch_size: 1
  grad_accum_steps: 128

training:
  max_steps: 100000
  checkpoint_every_steps: 5000
  log_every_steps: 10
  eval_every_steps: 1000
  val_batches: 32
  val_seed: 1234
  keep_checkpoints: 5

watchdog:
  nan_check_every_steps: 100

logging:
  tracker: wandb
  write_run_manifest: true
  run_manifest_path: runs/v230_70b_pretrain/run_manifest.json
