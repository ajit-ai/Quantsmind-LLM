# Taksh L0.3 — continued pretraining (CPU, bounded, from the v1.6.0 base)
#
# Warmstart: runs/v160_pretrain/checkpoint_last.pt (51,200 tokens of repo code).
# Corpus: data/l03_corpus (20,009,717 tokens; Wikipedia CC-BY-SA-3.0 + Gutenberg
# Public Domain + M3-verified MIT/BSD code + Apache-2.0 project source;
# deduped, licensed, provenance: data/l03_corpus/PROVENANCE.md).
#
# Bounded experiment: ~1.2M tokens over 600 steps. Full pretraining on this
# corpus (20M tokens) would need ~9,800 steps ≈ 8+ CPU-days; not launched
# without owner approval (see report).

run:
  name: qm-code-l03-pretrain
  model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokens_path: data/l03_corpus/train.tokens.bin
  val_tokens_path: data/l03_corpus/val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  dataset_manifest: data/l03_corpus/dataset_manifest.json
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 1.0e-3
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 2       # 2 x 512 x 2 = 2,048 tokens/step

training:
  max_steps: 600
  checkpoint_every_steps: 200
  log_every_steps: 25
  eval_every_steps: 50
  val_batches: 8
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/l03_pretrain/run_manifest.json
