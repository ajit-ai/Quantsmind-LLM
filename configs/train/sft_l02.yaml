# Taksh L0.2 — Bounded SFT experiment (data-qualified follow-up to v1.8.0)
#
# Same architecture, tokenizer, base checkpoint and optimizer family as
# sft_v180.yaml. The single intended variable vs v180_sft is the DATA
# (original, license-cleared, full-function responses: data/l02_sft/sft.jsonl).
# Longer than v180 in steps because the dataset is larger; batch size kept
# small for CPU.

run:
  name: qm-code-l02-sft
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  seq_len: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 1

training:
  max_steps: 300
  checkpoint_every_steps: 150
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: false
