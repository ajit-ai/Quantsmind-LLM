# Taksh L0.3 — GPU design (NOT RUN; no owner approval for GPU spend)
#
# Status: DESIGN ONLY. This file must not be executed. The MX150 (4 GB VRAM,
# driver 457.49, CUDA 11.1) is not a target: 28.8M-param bf16 training fits,
# but throughput is worse than CPU for this workload and the driver/toolkit
# mismatch makes flaky CUDA setups likely. A real run needs an A100/H100-class
# card, ≥8 GB free VRAM, and CUDA ≥ 12.x matching the installed torch build.
# NOTE: ``precision.dtype`` is not currently read by training/pretrain.py
# (float32 everywhere); bf16 support would be new code, and is not claimed.
#
#
# Differences vs pretrain_l03.yaml:
#   dtype: bf16          # (bf16 on Ampere+; fp16 overflows without scaling)
#   device: cuda
#   micro_batch_size: 16 # 16 x 2048 tokens/step at seq_len 2048
#   grad_accum_steps: 1
#   max_steps: 9800      # ~20M tokens, one epoch, ~2-4 hours on A100
#   checkpoint_every_steps: 500
#   warmup_steps: 200
#   torch.compile via default device path (pretrain.py enables it on cuda)
#
# Contract unchanged: same corpus, same tokenizer, same seed discipline,
# same validation protocol, same benchmark. Compare only against the CPU
# warmstart run at equal token counts.

run:
  name: qm-code-l03-pretrain-gpu
  model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokens_path: data/l03_corpus/train.tokens.bin
  val_tokens_path: data/l03_corpus/val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  dataset_manifest: data/l03_corpus/dataset_manifest.json
  seq_len: 2048

optimizer:
  type: adamw
  lr_peak: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: cuda

batch:
  micro_batch_size: 16
  grad_accum_steps: 1

training:
  max_steps: 9800
  checkpoint_every_steps: 500
  log_every_steps: 50
  eval_every_steps: 250
  val_batches: 8
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/l03_pretrain_gpu/run_manifest.json
