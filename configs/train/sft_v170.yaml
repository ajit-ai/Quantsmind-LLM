# Taksh v1.7.0 — SFT (Supervised Fine-Tuning) config
#
# Fine-tunes the v1.7.0 pretrained checkpoint on instruction→code completion
# pairs from simple_humaneval and additional cleared code examples.
#
# Demonstration scale: CPU-friendly, 100 steps.
# Goal: validate SFT pipeline at 100M scale.

run:
  name: qm-code-v170-sft
  base_checkpoint: runs/v170_100m_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v170_100m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/v160_sft/sft.jsonl
  val_jsonl: data/v160_sft/sft.jsonl
  max_length: 1024
  dataset_manifest: data/v170_corpus/taksh_code_v1.manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 5
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 100
  checkpoint_every_steps: 50
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/v170_sft/run_manifest.json
