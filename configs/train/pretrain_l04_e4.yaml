# TAKSH L0.4 — Experiment E4: like E1, sequence length as the single variable
# (seq_len 2048 instead of 512; micro_batch_size 1 keeps tokens/step at 2048).
# Targets the WP1 windowing finding (92% of code docs exceed 512 tokens).

run:
  name: qm-code-l04-e4
  model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokens_path: data/l04_code_corpus/train.tokens.bin
  val_tokens_path: data/l04_code_corpus/code_val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  dataset_manifest: data/l04_code_corpus/dataset_manifest.json
  seq_len: 2048

optimizer:
  type: adamw
  lr_peak: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 1
  grad_accum_steps: 2

training:
  max_steps: 300
  checkpoint_every_steps: 150
  log_every_steps: 25
  eval_every_steps: 50
  val_batches: 16
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/l04_e4/run_manifest.json
