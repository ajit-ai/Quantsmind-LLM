# Taksh v1.7.0 — Pretraining: 100M parameter model (CPU demonstration)
#
# Trains qm-code-v170-100m on a scaled cleared corpus.
# CPU-friendly: ~100M parameters, 200 steps, seq_len 1024.
#
# Goal: validate pipeline at 100M scale before committing to 1B+ GPU training.
# Loss should fall below uniform-random baseline (ln(5822) = 8.67).
# Useful code generation after pretraining alone is NOT claimed.

run:
  name: qm-code-v170-100m-pretrain
  model_config: configs/model/code_v170_100m.yaml
  seed: 42

data:
  tokens_path: data/v170_tokens/train.tokens.bin
  val_tokens_path: data/v170_tokens/val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  dataset_manifest: data/v170_tokens/manifest.json
  seq_len: 1024

optimizer:
  type: adamw
  lr_peak: 3.0e-3
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 1
  grad_accum_steps: 2

training:
  max_steps: 200
  checkpoint_every_steps: 50
  log_every_steps: 10
  eval_every_steps: 50
  val_batches: 4
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/v170_100m_pretrain/run_manifest.json
