# TAKSH L0.4 — Experiment E1: code-dense (50/50) continued pretraining.
#
# One principal variable vs the L0.3 baseline: the training data.
# Same architecture, tokenizer, seed, optimizer family, LR peak as L0.3,
# same tokens/step (4 x 512-equivalents = 2048), one variable changed only.
#
# Warmstart: runs/l03_pretrain/checkpoint_last.pt (integrity-verified,
# sha256 90c3a72e4d...). Validation: code holdout (m3 aiohttp, never trained).

run:
  name: qm-code-l04-e1
  model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokens_path: data/l04_code_corpus/train.tokens.bin
  val_tokens_path: data/l04_code_corpus/code_val.tokens.bin
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  dataset_manifest: data/l04_code_corpus/dataset_manifest.json
  seq_len: 512

optimizer:
  type: adamw
  lr_peak: 6.0e-4
  lr_schedule: cosine
  warmup_steps: 20
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 2

training:
  max_steps: 300
  checkpoint_every_steps: 150
  log_every_steps: 25
  eval_every_steps: 50
  val_batches: 16
  val_seed: 1234
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/l04_e1/run_manifest.json
