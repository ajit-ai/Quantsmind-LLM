# Taksh v1.8.0 — SFT config on expanded dataset (57 examples)
#
# Fine-tunes the v1.6.0 pretrained 15M checkpoint on expanded instruction→code pairs.

run:
  name: qm-code-v180-sft
  base_checkpoint: runs/v160_pretrain/checkpoint_last.pt
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/v180_sft/sft.jsonl
  val_jsonl: data/v180_sft/sft.jsonl
  max_length: 512
  dataset_manifest: data/v180_corpus/taksh_code_v1.manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-5
  lr_schedule: cosine
  warmup_steps: 5
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 200
  checkpoint_every_steps: 100
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/v180_sft/run_manifest.json
