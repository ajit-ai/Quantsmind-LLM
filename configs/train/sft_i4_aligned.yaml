# TAKSH I4 — aligned-format SFT experiment on the v180_sft checkpoint.
#
# Aligned prompt contract candidate:
#   - v180_sft was trained (and scored 0/20) with informal natural-language prompts.
#   - This run fine-tunes from the v180_sft checkpoint on the locally authored,
#     CC0 l02_sft dataset (instruction -> full-function response), rendered by the
#     canonical v1 plain_instruction template.
#
# This config is a BOUNDED, CPU-ONLY experiment. It does not authorize release,
# publication, or any capability claim; it only measures whether an aligned format
# moves the immutable native_v01 suite away from zero. If it does not, the result
# is recorded honestly and no claim is made.
#
# Authorized: owner approved "bounded CPU experiments" + "local corpora only" on
# 2026-11-19. Only v180_sft, l02_sft, l04_code_corpus are permitted. Checkpoint
# writes go to runs/i4_aligned_sft/ and are never committed.

run:
  name: qm-code-i4-aligned
  base_checkpoint: runs/v180_sft/checkpoint_last.pt  # weights unchanged to the frozen v180_sft baseline
  base_model_config: configs/model/code_v160_15m.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v1.json
  train_jsonl: data/l02_sft/sft.jsonl
  val_jsonl: data/l02_sft/sft.jsonl
  max_length: 512
  dataset_manifest: data/l02_sft/dataset_manifest.json

optimizer:
  type: adamw
  lr_peak: 2.0e-5
  lr_schedule: cosine
  warmup_steps: 10
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto  # falls back to CPU

batch:
  micro_batch_size: 2
  grad_accum_steps: 1

training:
  max_steps: 100
  checkpoint_every_steps: 50
  log_every_steps: 10

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  write_run_manifest: true
  run_manifest_path: runs/i4_aligned_sft/run_manifest.json
