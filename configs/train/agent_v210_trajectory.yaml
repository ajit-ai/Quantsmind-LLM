# Taksh v2.1.0 — Agent Trajectory Fine-Tuning: 7B Parameter Model
#
# Fine-tunes v210 tool-use model on complete agent trajectories
# (plan → act → critique → act).
#
# GPU cluster required.

run:
  name: qm-code-v210-7b-trajectory
  base_checkpoint: runs/v210_agent_tool_use/checkpoint_last.pt
  base_model_config: configs/model/code_v210_7b_agent.yaml
  seed: 42

data:
  tokenizer: tokenizer/taksh_code_bpe_v2.json
  train_jsonl: data/v210_agent/trajectories.jsonl
  val_jsonl: data/v210_agent/trajectories_val.jsonl
  max_length: 8192
  dataset_manifest: data/v210_agent/manifest.json

optimizer:
  type: adamw
  lr_peak: 5.0e-6
  lr_schedule: cosine
  warmup_steps: 50
  min_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: bfloat16
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 8

training:
  max_steps: 10000
  checkpoint_every_steps: 1000
  log_every_steps: 50

watchdog:
  nan_check_every_steps: 50

logging:
  tracker: wandb
  write_run_manifest: true
  run_manifest_path: runs/v210_agent_trajectory/run_manifest.json
