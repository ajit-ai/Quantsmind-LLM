# TAKSH v3.0.0 — machine-readable roadmap and milestone registry
#
# Canonical, versioned registry of every approved milestone from L0.5 through
# L3.7 and the v1.0.0 / v2.0.0 / v3.0.0 release gates. Status is never inferred
# from existence of code or documents: it is the recorded outcome of that
# milestone's own qualification, nothing else.
# No owner decision, authorization, capability or release is created by this file.
schema: taksh.v3_roadmap_registry/1
id: taksh-v3-roadmap-v1
version: 1
created: "2026-11-11"
owner: ajit-ai
v3_target: "TAKSH v3.0.0 — Advanced Autonomous Software Engineering (proven, independent, repository-aware)"

statuses:
  - NOT_STARTED
  - IN_PROGRESS
  - BLOCKED
  - CONDITIONAL_PASS
  - QUALIFIED
  - RELEASE_CANDIDATE
  - GA
  - DEFERRED

