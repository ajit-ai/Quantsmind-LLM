# TAKSH L0.5.1 — Multilingual language registry (53 languages)
#
# Single source of truth for the long-term language catalogue. The initial
# L1.0 target is exactly 16 languages (marked l1_target: true). All other
# languages are roadmap items with explicit qualification status.
#
# Supporting technologies (markup/config/HDL/etc.) are deliberately kept
# separate from the 53 general-purpose programming languages: they are tracked
# in `supporting_technologies` below and do NOT count towards the 53.
#
# Validation rules enforced by evaluation/l051_language_registry.py:
#   * unique language ids
#   * category in the allowed set
#   * exactly 16 L1.0 targets
#   * required fields present
#   * supporting_technologies entries never appear in `languages`

schema: taksh.l051_languages/1
created: 2026-11-11

categories:
  l1_target: "L1.0 initial target (16 languages)"
  enterprise: "Enterprise, business and legacy"
  scientific: "Scientific, mathematical and functional"
  systems: "Systems, embedded, games and blockchain"
  emerging: "Emerging and specialist"

