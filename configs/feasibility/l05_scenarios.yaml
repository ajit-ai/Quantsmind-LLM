# TAKSH L0.5 — Feasibility scenarios (analytical only; nothing is trained or built).
#
# Every figure the L0.5 tools emit derives from this file (plus measured facts
# from evaluation/l04_diagnostic_report.json and prior run manifests).
#
# Constraints respected:
#   * tokenizer fixed (taksh_code_bpe_v1.json, vocab 5,822, specials 0/1/2/3)
#   * architecture family unchanged (RMSNorm + RoPE + GQA + SwiGLU, tied embeddings)
#   * no model in this file is created, trained, or evaluated

schema: taksh.l05_scenarios/1
created: 2026-11-11

baseline:
  name: qm-code-v160-15m
  vocab_size: 5822
  d_model: 384
  n_layers: 12
  n_heads: 8
  n_kv_heads: 4        # GQA: 2:1 query:kv ratio
  ffn_dim: 1536        # 4 x d_model
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1.0e-05
  tie_embeddings: true
  rope_base: 10000.0
  measured_params: 28787328
  measured_file_bytes: 345596357

architecture_scenarios:
  current:
    name: existing
    d_model: 384
    n_layers: 12
    n_heads: 8
    n_kv_heads: 4
    ffn_dim: 1536
    notes: measured baseline
  A:
    name: candidate_A_100M
    d_model: 768
    n_layers: 12
    n_heads: 12
    n_kv_heads: 6      # keep 2:1 GQA ratio
    ffn_dim: 3072      # 4 x d_model
    context: 2048
    notes: "~111M (12-layer trim of a 128M 14-layer variant); closest honest match to the 100M target without arbitrary shrinking"
  B:
    name: candidate_B_300M
    d_model: 1024
    n_layers: 18
    n_heads: 16
    n_kv_heads: 8
    ffn_dim: 4096
    context: 4096
    notes: ~300M class; context raised to 4096 (RoPE extrapolation not validated past 2048)
  C:
    name: candidate_C_1B
    d_model: 2048
    n_layers: 16
    n_heads: 16
    n_kv_heads: 8
    ffn_dim: 8192
    context: 4096
    notes: ~1B class; head_dim 128; requires multi-epoch passes or a bigger corpus

token_ratios: [20, 50, 100, 200]   # tokens per parameter, sensitivity scenarios only

qualified_token_supply:
  code_tokens: 1590703          # L0.4 corpus, measured (per-domain tokenization)
  code_val_tokens: 320388       # aiohttp holdout; never trained on
  general_tokens_l03: 19629683  # Wikipedia/Gutenberg (CC-BY-SA-3.0 / Public Domain)
  general_tokens_l04: 1591655   # L0.4 general slice
  total_l04_train: 3182359
  corpus_v0_total: 9993983      # DATA_CARD_v0 (qm_bpe_v0 49K), original figure
  notes: >-
    Counts are measured with tokenizer/taksh_code_bpe_v1.json except corpus_v0,
    whose documented figure is with the obsolete 49,152-vocab tokenizer.

hardware_classes:
  cpu_only:        { label: "CPU-only (this environment)", vram_gb: 0,  notes: "measured ~2048 tok/step at ~220 tok/s" }
  mx150_4gb:       { label: "MX150 4 GB", vram_gb: 4,   notes: "driver 457.49, CUDA 11.1; NOT suitable (toolkit mismatch)" }
  vram_8gb:        { label: "8 GB VRAM class", vram_gb: 8,   notes: "e.g. RTX 3060 Laptop / A2000 8 GB" }
  vram_16gb:       { label: "16 GB VRAM class", vram_gb: 16,  notes: "e.g. RTX 4080 / A4000 16 GB" }
  vram_24gb:       { label: "24 GB VRAM class", vram_gb: 24,  notes: "e.g. RTX 4090 / 3090 / A5000 24 GB" }
  vram_48gb:       { label: "48 GB VRAM class", vram_gb: 48,  notes: "e.g. RTX 6000 Ada / A6000 48 GB" }
  vram_80gb:       { label: "80 GB VRAM class", vram_gb: 80,  notes: "e.g. A100 80 GB / H100 80 GB" }

training_throughput_anchor:
  measured_tokens_per_second: 215   # L0.3 run, ~2048 tok per ~9.3 s/step (see loss_log)
  measured_range: [180, 260]

benchmark:
  name: taksh.l02_python_bench/1
  path: evaluation/l02_python_bench_v1.json
  sha256: 854c7ca833c224eb97aa71bea5dfd534e6e8ed1ba4b375d9cf7bf3f368a5e4a6
  problems: 30
  categories: { A: 10, B: 10, C: 10 }
