# Taksh v2.0.0 — Tokenizer Configuration
#
# BPE tokenizer trained on 5B–20B tokens of cleared code corpus.
# Vocab size: 32,768 (larger than v1.9.0's 5,822 for better compression).
#
# Special tokens include FIM (Fill-In-the-Middle) markers for code completion.

tokenizer:
  name: taksh-code-bpe-v2
  vocab_size: 32768
  min_frequency: 5
  normalizer: NFKC
  pre_tokenizer: ByteLevel
  decoder: ByteLevel
  special_tokens:
    - "<pad>"
    - "<bos>"
    - "<eos>"
    - " unk"
    - "<mask>"
    - "<|fim_prefix|>"
    - "<|fim_suffix|>"
    - "<|fim_middle|>"
    - "<|repo_name|>"
    - "<|file_sep|>"
    - "<|language|>"
