# TAKSH L0.7.0 — Dataset source registry v1
#
# Versioned, extensible registry of training-data sources. A source enters this
# registry as DISCOVERED and may only progress through explicit review states.
# NOTHING in this registry is qualified for acquisition. The owner alone can
# authorize ACQUISITION_AUTHORIZED, and execution is DISABLED in this milestone.
#
# Evidence gathered 2026-11-11 (metadata pages only; NO dataset content accessed):
#   https://huggingface.co/datasets/bigcode/the-stack          (gated; ToU pass-through)
#   https://huggingface.co/datasets/bigcode/the-stack-v2       (gated; SWHID-only; SWH+INRIA agreement required)
#   https://huggingface.co/datasets/bigcode/bigcode-stack-v1   (HTTP 401 — gated/removed; terms unverifiable)
#   https://github.com/github/CodeSearchNet                    (code+docs: MIT)
#   https://arxiv.org/abs/1909.09436                           (corpus construction: redistributable-licensed GitHub repos)
schema: taksh.dataset_source_registry/1
id: taksh-dataset-source-registry-v1
version: 1
created: "2026-11-11"

statuses:
  - DISCOVERED            # catalogued; nothing verified
  - METADATA_REVIEW       # license/ToU/provenance metadata being assessed
  - LICENSE_REVIEW        # legal qualification in progress
  - PROVENANCE_REVIEW     # source traceability being assessed
  - TECHNICAL_REVIEW      # format/quality/contamination being assessed
  - OWNER_APPROVAL_REQUIRED  # all reviews done; awaiting owner sign-off
  - QUALIFIED_FOR_ACQUISITION # owner-visible readiness signal (not an authorization)
  - ACQUISITION_AUTHORIZED  # owner decision recorded; execution still disabled this milestone
  - ACQUIRED              # execution happened under authorization (none in this milestone)
  - REJECTED              # failed qualification
  - DEFERRED              # intentionally postponed
  - BLOCKED               # license/provenance/contamination/safety blocker

