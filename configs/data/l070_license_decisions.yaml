      dependency_licenses: { decision: UNKNOWN, note: "n/a", training_use: false }
      redistribution_restrictions: { decision: REJECTED, note: "no redistribution authorization ever issued", training_use: false }
      commercial_use_permissions: { decision: REJECTED, note: "not granted", training_use: false, commercial_use: false }
      derivative_work_restrictions: { decision: HUMAN_LEGAL_REVIEW_REQUIRED, note: "owner decision pending; no statement exists", training_use: false }
      ml_training_permissions: { decision: REJECTED, note: "explicitly NOT authorized; separate kcc/compiler precondition unmet", training_use: false }
      terms_of_service: { decision: APPROVED, note: "internal governance applies; compliant by construction when untouched", training_use: false }
      dataset_specific_restrictions: { decision: HUMAN_LEGAL_REVIEW_REQUIRED, note: "SPEC versions drift; contamination vs TAKSH-KARK-BENCH unknown", training_use: false }
      copyright_attribution: { decision: HUMAN_LEGAL_REVIEW_REQUIRED, note: "owner to specify if/when ingestion is ever authorized", training_use: false }
    unresolved_questions:
      - "whether any Karkain corpus may ever enter TAKSH training data — owner decision, no current grant"
      - "kcc repair path on a supported host"
    required_attribution: "TBD by owner"
    required_exclusions: "all content until authorized"
    owner_approval_state: "not_requested"
    overall_decision: "HUMAN_LEGAL_REVIEW_REQUIRED"
