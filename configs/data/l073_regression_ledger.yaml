entries:
  - id: ledger-001
    test: tests/test_m5_adapters_syntax.py::test_external_adapter_does_not_download_by_default
    historical_failure: "Expected 'nothing was fetched'; actual 'the transformers package is not installed' (CI runner without transformers)"
    root_cause: "preflight required transformers before weights discovery; adapter discovery depended on an optional dependency"
    affected_code: evaluation/m5_adapters.py
    affected_tests: tests/test_m5_adapters_syntax.py
    corrective_change: "preflight reordered: licence record -> dependency-free weights discovery -> RAM -> transformers load decision; missing-dependency output merges both facts into one stable reason string"
    regression_test: "existing test unchanged (passes on hosts with and without transformers); monkeypatched-missing-dependency test passes; offline default preserved (no download, no fetch)"
    disposition: RESOLVED
    evidence: "tests/test_m5_adapters_syntax.py (32 tests incl. this one) pass locally on Python 3.14.7; discovery never imports transformers"
    residual_risk: "none identified; availability truth table is environment-independent by construction"

  - id: ledger-002
    test: tests/test_m6_sovereign.py::test_available_ram_is_the_binding_constraint
    historical_failure: "RAM constraint assertion fails on CI host"
    root_cause: "assertion depending on live host RAM (non-deterministic)"
    affected_code: evaluation/m6_sovereign.py (estimate_scales), tests/test_m6_sovereign.py
    affected_tests: tests/test_m6_sovereign.py
    corrective_change: "estimate_scales(memory=None) — injectable measurement; default stays live"
    regression_test: "test_available_ram_is_the_binding_constraint rewritten as deterministic synthetic-memory policy test (total 4 GiB, available 128 MiB); environment-observation test added separately (informational only)"
    disposition: RESOLVED
    evidence: "tests/test_m6_sovereign.py passes; deterministic injection verified"
    residual_risk: "fits_* verdicts vary with the host measurement when run live; this is intended (host-pressure guard)"

  - id: ledger-003
    test: tests/test_v120_python_data.py::test_g7_manifest_has_no_timestamp_or_absolute_path
    historical_failure: "manifest leaked /tmp/pytest-of-runner/pytest-0/python_v10/bench.jsonl"
    root_cause: "benchmark provenance embedded the resolved absolute local path (absolved via base_dir join)"
    affected_code: data/python_v1/benchmarks.py (load_benchmark_records)
    affected_tests: tests/test_v120_python_data.py
    corrective_change: "provenance records the DECLARED registry path (portable), or local://<basename> for absolute declarations; content_sha256 added for integrity evidence"
    regression_test: "v120 suite now passes incl. test_g7_manifest_has_no_timestamp_or_absolute_path; a dedicated tmp-dir no-leakage regression lives in tests/test_l073_readiness.py::test_benchmark_manifest_has_no_absolute_paths"
    disposition: RESOLVED
    evidence: "tests/test_v120_python_data.py 69 passed, 1 skipped; manifest builds byte-deterministically"
    residual_risk: "absolute paths declared by an operator in a registry would be normalized to local://<basename> — documented behaviour"

  - id: ledger-004
    test: tests/test_v150_coding_foundation.py::test_geometry_inspector_reports_a_matching_triple
    historical_failure: "FileNotFoundError runs/m7_pretrain/checkpoint_last.pt"
    root_cause: "test consumed an untracked production checkpoint; runs/ is gitignored; absent on CI checkout"
    affected_code: tests/test_v150_coding_foundation.py
    affected_tests: tests/test_v150_coding_foundation.py, tests/fixture_s2_checkpoint.py
    corrective_change: "S2-equivalent synthetic fixture built in tmp_path (exact code_m3_9m geometry, step=300, clearly labelled NOT production); geometry inspector assertions unchanged"
    regression_test: "test uses build_s2_checkpoint(tmp_path); asserts report.compatible — fails nowhere; strict identity/vocab/step checks retained"
    disposition: RESOLVED
    evidence: "tests/test_v150_coding_foundation.py passes locally with fixture"
    residual_risk: "synthetic fixture is never a production artifact; CI now exercises the same inspector path on any runner"

  - id: ledger-005
    test: tests/test_v150_coding_foundation.py::test_tokenizer_artifact_and_model_geometry_are_unchanged
    historical_failure: "missing runs/m7_pretrain/checkpoint_last.pt"
    root_cause: "same untracked-artifact dependency"
    affected_code: tests/test_v150_coding_foundation.py
    affected_tests: tests/test_v150_coding_foundation.py
    corrective_change: "identical fixture approach; assertions unchanged (embedding_rows/output_projection_rows == 5822; context_window == 2048)"
    regression_test: "test_tokenizer_artifact_and_model_geometry_are_unchanged now builds fixture per test"
    disposition: RESOLVED
    evidence: "passes locally with fixture"
    residual_risk: "none identified"

  - id: ledger-006
    test: tests/test_v160_authorization_and_baseline.py::test_g10_geometry_inspector_accepts_the_s2_triple
    historical_failure: "missing runs/m7_pretrain/checkpoint_last.pt"
    root_cause: "same untracked-artifact dependency"
