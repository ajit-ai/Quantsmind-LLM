  - id: ledger-007
    test: tests/test_v180_corpus_qualification.py::test_sampled_decoding_is_reproducible_with_a_seed
    historical_failure: "FileNotFoundError runs/m7_pretrain/checkpoint_last.pt"
    root_cause: "same untracked-artifact dependency (also via legacy unsafe load path)"
    affected_code: tests/test_v180_corpus_qualification.py
    affected_tests: tests/test_v180_corpus_qualification.py
    corrective_change: "fixture-based model; seeds must decode identically; greedy and seeded sampling unchanged; no production-quality claim"
    regression_test: "test_sampled_decoding_is_reproducible_with_a_seed loads fixture via default safe path (no allow_unsafe_trusted)"
    disposition: RESOLVED
