# Quantsmind-LLM model config — local prototype (~11M params)
# Sized for: i7-8550U CPU + MX150 2GB, 4GB RAM, zero rupees
# Same architecture family as Llama (RMSNorm/RoPE/GQA/SwiGLU), just smaller
model:
  name: qm-local-15m
  vocab_size: 49152
  d_model: 128
  n_layers: 6
  n_heads: 4
  n_kv_heads: 2          # GQA: KV cache /2 vs MHA
  ffn_dim: 512           # SwiGLU
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true   # save params at this scale
