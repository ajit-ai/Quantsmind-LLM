# Taksh v2.2.0 — Specialized Domain Model: Embedded/IoT (7B)
#
# Fine-tuned from v2.0.0 7B base on embedded/IoT development data.
# Specialized for C/C++, microcontrollers, RTOS, memory-constrained code.
#
# Same architecture as v2.0.0 7B base model.

model:
  name: qm-code-v220-embedded-7b
  vocab_size: 32768
  d_model: 4096
  n_layers: 32
  n_heads: 32
  n_kv_heads: 8
  ffn_dim: 11008
  max_seq_len: 32768
  rope_theta: 1000000.0
  norm_eps: 1.0e-5
  tie_embeddings: false
