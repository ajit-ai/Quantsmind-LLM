# M7 candidate instruction tuning: M7 pretrained base -> supervised coding model.
#
# The base checkpoint is produced by configs/train/pretrain_m7.yaml. It is never
# the M3 or M4 checkpoint: M7 must be attributable to the M7 run.
#
# Data: data/m7/m7-code-supervised-v0.train.jsonl (507 records) and .val.jsonl
# (58 records), built by `python -m data.build_m7_dataset`. Every record carries
# a source repository, licence, source hash, and partition. The locked
# psf-requests partition is not in either file.
#
# 120 steps x 4096 tokens = 491,520 tokens. The supervised-token fraction is
# ~0.37, so this is about 3 epochs over the ~58k supervised tokens, not a
# production-scale instruction run.
run:
  name: qm-code-m7-sft
  base_checkpoint: runs/m7_pretrain/checkpoint_best.pt
  base_model_config: configs/model/code_m3_9m.yaml
  seed: 42

data:
  train_jsonl: data/m7/m7-code-supervised-v0.train.jsonl
  val_jsonl: data/m7/m7-code-supervised-v0.val.jsonl
  dataset_manifest: data/m7/m7-code-supervised-v0.manifest.json
  tokenizer: tokenizer/qm_code_bpe_v0.json
  max_length: 512
  supervise_prompt: false

adaptation:
  freeze_policy: none

optimizer:
  type: adamw
  lr_peak: 5.0e-4
  lr_schedule: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 2

training:
  max_steps: 120
  checkpoint_every_steps: 40
  log_every_steps: 10
  eval_every_steps: 30
  val_batches: 8
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  run_manifest_path: runs/m7_sft/run_manifest.json
