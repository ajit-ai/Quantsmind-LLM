# M4 instruction tuning: M3 base checkpoint -> instruction-following model.
#
# Base model: runs/m3_base/checkpoint_best.pt (2,853,280 params, trained in M3
# on 1,165,217 licence-verified tokens). This config FINE-TUNES it; it does not
# retrain from scratch, and the M3 checkpoint is never modified.
#
# Data: data/instruct_v1.train.jsonl / .val.jsonl, built by
#   python -m data.build_instruction_dataset
# from the same licence-verified sources. Every record carries provenance.
# 610 train / 21 val records -- see reports/M4_INSTRUCTION_TRAINING_REPORT.rst
# for why this is far smaller than a production instruction corpus.
#
# Preflight first:
#   python -m training.preflight --config configs/train/sft_m4.yaml --probe-steps 3
run:
  name: qm-code-m4-instruct
  base_checkpoint: runs/m3_base/checkpoint_best.pt
  base_model_config: configs/model/code_m3_3m.yaml
  seed: 42

data:
  train_jsonl: data/instruct_v1.train.jsonl
  val_jsonl: data/instruct_v1.val.jsonl
  dataset_manifest: data/instruct_v1.manifest.json
  tokenizer: tokenizer/qm_code_bpe_v0.json
  max_length: 512
  # Assistant-only supervision. The alternative, true, would train on the
  # prompt too; it is supported and tested, and is not the default.
  supervise_prompt: false

adaptation:
  # Fine-tuning policy. Deliberately NOT named `model:` -- `model:` means
  # architecture in every other config here, and reusing it for a policy
  # block silently shadowed the architecture when the checkpoint was reloaded.
  # Fine-tuning policy. "full" updates every parameter, which is the right
  # choice for a 2.85M model on this hardware.
  freeze_policy: none

optimizer:
  type: adamw
  # Deliberately below the M3 pretraining peak of 3e-3: tuning a converged
  # base model at the pretraining learning rate would wash out what it learned.
  lr_peak: 5.0e-4
  lr_schedule: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  grad_clip: 1.0

precision:
  dtype: float32
  device: auto

batch:
  micro_batch_size: 4
  grad_accum_steps: 2       # 4 x 2 x 512 = 4096 tokens/step

training:
  # 120 steps x 4096 = 491,520 tokens over a 610-example dataset (~0.8M supervised
  # tokens available). Enough to demonstrate a behavioural change; not enough to
  # claim general instruction following.
  max_steps: 120
  checkpoint_every_steps: 40
  log_every_steps: 10
  eval_every_steps: 30
  val_batches: 8
  keep_checkpoints: 2

watchdog:
  nan_check_every_steps: 10

logging:
  tracker: none
  run_manifest_path: runs/m4_sft/run_manifest.json