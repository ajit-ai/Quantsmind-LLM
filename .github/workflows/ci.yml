name: CI

# Ownership: repository automation for develop/main PRs and pushes.
#
# HISTORY/FIX (2026-11-12, isolated integration): this workflow no longer executes
# training. The historical steps (`scripts/smoke_pipeline.sh`,
# `training.pretrain`, `training.train_mm`) update weights and create checkpoints,
# which owner decisions A1.1-C (preparation-only) and A2-E (no compute) prohibit.
# They are preserved verbatim below `blocked-training-smoke` and can only execute
# when the owner sets the repository variable `TAKSH_ENABLE_TRAINING_CI=true`.
# Until then they run zero times and are reported as blocked, never as passed.
#
# Visibility limitation (verified 2026-11-12): this workflow triggers only on
# pushes to develop/main and on PRs. Pushes to a feature branch execute no remote
# CI. `ci-l0704-manual-qualification.yml` is the manual qualification path and is
# dispatchable only from the default branch (GitHub policy). See
# docs/audit/TAKSH-CICD-DOCUMENTATION-RECOVERY.md.
# Node: runs-on=ubuntu-latest (Ubuntu 26 migration pending upstream); actions
# Node-24-forced; cosmetic upstream annotations, not defects.

permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Solo-contributor guard
        # Private Free repos cannot enforce branch protection server-side,
        # so CI is the gate: only ajit-ai may push; all others fail fast.
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.actor }}" != "ajit-ai" ]; then
            echo "Blocked: sole contributor is ajit-ai (see docs/RULEBOOK.md)."
            exit 1
          fi

  unit-and-smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Install release tooling
        run: pip install build twine sphinx sphinx-rtd-theme

      - name: Version consistency
        run: python scripts/check_version_consistency.py

      - name: Release build, install and docs check
        run: python scripts/prepare_release.py --skip-tests --skip-serving --evidence-dir "$RUNNER_TEMP/release-evidence"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence

      - name: UI module import check
        run: python -c "import serving.app"

      # REMOVED FROM DEFAULT EXECUTION — training-dependent (A1.1-C / A2-E):
      #   End-to-end smoke pipeline (trains a toy model, writes runs/smoke/*)
      #   Resume-from-checkpoint check (training.pretrain --resume)
      #   M1.1 multimodal hermetic smoke (training.train_mm)
      # See blocked-training-smoke below; definitions preserved verbatim.

      - name: Code LLM — tokenizer round-trip check   # non-training: trains a tokenizer, never model weights
        run: |
          python -c "
          from tokenizer.train_tokenizer import train_tokenizer, sanity_report
          import tempfile, os
          samples = ['def foo(x):\\n    return x * 2', 'const bar = (x) => x + 1']
          with tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=False) as f:
              f.write('\\n'.join(samples * 50))
              f.flush()
              tok = train_tokenizer(f.name, f.name + '.json', vocab_size=500)
              report = sanity_report(tok, samples)
              assert report['all_roundtrip_ok'], 'tokenizer round-trip failed'
              print(f'code tokenizer OK: vocab={report[\"vocab_size\"]}')
              os.unlink(f.name)
              os.unlink(f.name + '.json')
          "

      - name: Code LLM — model config validation
        run: |
          python -c "
          import yaml
          cfg = yaml.safe_load(open('configs/model/code_30m.yaml'))['model']
          assert cfg['d_model'] == 256
          assert cfg['n_layers'] == 8
          assert cfg['vocab_size'] == 32768
          assert cfg['n_heads'] % cfg['n_kv_heads'] == 0
          print('code_30m config OK')
          "

      - name: Code LLM — SFT dataset validation
        run: |
          python -c "
          import json, tempfile
          from training.sft import SFTPairDataset, collate_sft
          samples = [
              {'instruction': 'Write add function', 'response': 'def add(a, b): return a + b'},
              {'instruction': 'Explain decorators', 'response': 'Decorators wrap functions'},
          ]
          with tempfile.NamedTemporaryFile(mode='w', suffix='.jsonl', delete=False) as f:
              for s in samples:
                  f.write(json.dumps(s) + '\\n')
              f.flush()
              ds = SFTPairDataset(f.name, None)
              assert len(ds) == 2
              print(f'SFT dataset OK: {len(ds)} pairs')
          "

      - name: Code LLM — eval harness import check
        run: |
          python -c "from evaluation.eval_code import HUMANEVAL_PROBLEMS, MBPP_PROBLEMS; print('eval OK: %d HumanEval + %d MBPP problems' % (len(HUMANEVAL_PROBLEMS), len(MBPP_PROBLEMS)))"

      - name: Code LLM — serving module import check
        run: python -c "from serving.code_chat import format_prompt; print('code_chat OK')"

      - name: OpenAI-compatible API route check
        run: |
          python -c "
          from serving.openai_server import app
          routes = sorted(r.path for r in app.routes if hasattr(r, 'path'))
          assert '/v1/models' in routes, routes
          assert '/v1/chat/completions' in routes, routes
          assert '/load' not in routes, 'must not expose request-driven checkpoint loading'
          print('openai_server OK:', routes)
          "

      - name: Legacy servers expose no request-triggered checkpoint loading
        run: |
          python -c "
          from serving.completion_server import app as cs
          from serving.review_server import app as rs
          for name, a in (('completion_server', cs), ('review_server', rs)):
              routes = sorted(r.path for r in a.routes if hasattr(r, 'path'))
              assert '/load' not in routes, f'{name} still exposes /load: {routes}'
              print(f'{name} OK: {routes}')
          from serving.server_security import resolve_bind_host
          import pytest
          with pytest.raises(SystemExit):
              resolve_bind_host('0.0.0.0', allow_remote=False)
          print('loopback default enforced')
          "

  # -----------------------------------------------------------------------
  # BLOCKED_OWNER_AUTHORIZATION_REQUIRED (A1.1-C / A2-E) — do not re-enable
  # without an explicit owner authorization recorded via
  # docs/L075_L080_OWNER_DECISION_RECORD.md (absent; not committed
  # on this branch) or the repository variable `TAKSH_ENABLE_TRAINING_CI=true`.
  #
  # A1.1-C authorizes preparation and preflight only; A2-E grants no compute.
  # These steps update weights and create checkpoints; running them is a
  # training act. They are preserved verbatim for future authorized use.
  # -----------------------------------------------------------------------
  blocked-training-smoke:
    if: ${{ vars.TAKSH_ENABLE_TRAINING_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: End-to-end smoke pipeline (tiny CPU train) — BLOCKED until owner authorizes training CI
        run: bash scripts/smoke_pipeline.sh

      - name: Resume-from-checkpoint check — BLOCKED until owner authorizes training CI
        run: python -m training.pretrain --config configs/train/smoke_toy.yaml --out-dir runs/smoke --tokens runs/smoke/tokens.bin --resume --max-steps 40

      - name: M1.1 multimodal hermetic smoke (tiny CPU) — BLOCKED until owner authorizes training CI
        run: |
          python scripts/synth_images.py --out runs/mm_synth/data.npz --n 8
          python -m training.train_mm --config configs/train/mm_fit_check.yaml --out-dir runs/mm_smoke --max-steps 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: |
            runs/smoke/tokenizer.report.json
            runs/smoke/tokens.meta.json

