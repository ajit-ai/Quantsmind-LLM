name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: UI module import check
        run: python -c "import serving.app"

      - name: End-to-end smoke pipeline (tiny CPU train)
        run: bash scripts/smoke_pipeline.sh

      - name: Resume-from-checkpoint check
        run: python -m training.pretrain --config configs/train/smoke_toy.yaml --out-dir runs/smoke --tokens runs/smoke/tokens.bin --resume --max-steps 40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: |
            runs/smoke/tokenizer.report.json
            runs/smoke/tokens.meta.json
